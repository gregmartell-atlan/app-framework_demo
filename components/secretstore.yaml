# Dapr secret store — reads secrets from environment variables.
# The SDK's DaprSecretStore looks up the component named "secretstore"
# (SECRET_STORE_NAME). secretstores.local.env resolves each requested secret
# key from the process environment — so export ATLAN_API_KEY / GITHUB_TOKEN
# (or whatever the credential GUIDs resolve to) before launching.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
spec:
  type: secretstores.local.env
  version: v1
  metadata: []
