[project]
name = "atlan-github-app"
version = "0.1.0"
description = "Atlan native app — GitHub connector (REST extraction pattern)"
requires-python = ">=3.11"
authors = [{ name = "Greg Martell", email = "greg.martell@atlan.com" }]
readme = "README.md"
license = { text = "Apache-2.0" }

dependencies = [
    # SDK pinned per v3-readiness §1. No 'sql' extra needed (REST connector).
    "atlan-application-sdk==3.4.0",
    "httpx>=0.27,<0.29",
    "pydantic>=2.7,<3",
    "pyatlan>=9.6,<10",
    # Git operations for wiki cloning (v3 compliance rule 11)
    "GitPython>=3.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",            # httpx mocking for E2E replay tests
    "ruff>=0.5",
    "pyright>=1.1.370",
    "poethepoet>=0.27",
    "uvicorn>=0.30",          # serve_playground.py config-screen preview
    "starlette>=0.37",        # serve_playground.py config-screen preview
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Linting / type-checking — _input.py is generated; exclude per contract skill
# ---------------------------------------------------------------------------
[tool.ruff]
exclude = ["app/generated/_input.py"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E501"]  # long lines OK (mostly docstrings)

[tool.pyright]
exclude = [".github/**", "app/generated/_input.py"]
reportMissingImports = "warning"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration tests that need a live or replayed GitHub backend",
    "boot_probe: full handler/worker boot test",
]

# ---------------------------------------------------------------------------
# Poe — task runner; matches the contract skill's expected layout
# ---------------------------------------------------------------------------
[tool.poe.tasks]
# Generate workflow / credential / manifest / _input.py from contract/app.pkl.
# Run on every contract change; CI fails on `git diff` after `poe generate`.
generate.shell = "cd contract && pkl eval -m ../app/generated app.pkl && mv ../app/generated/input.py ../app/generated/_input.py"

# Static checker bundled with application-sdk — exits 0 only on full v3 compliance.
check-v3 = "python -m tools.migrate_v3.check_migration --no-color app/"

# Local boot in combined mode (handler + worker in one process). Requires a
# Dapr sidecar + Temporal — prefer `stack` (below) which wires up everything.
dev = "python -m app.run_dev"

# --- ONE-COMMAND local run (recommended) ------------------------------------
# Backgrounds the Temporal dev server (logs -> /tmp/temporal-dev.log), waits
# for :7233 to accept connections, then runs the app under a Dapr sidecar in
# the foreground. Ctrl+C stops the app + Dapr; stop Temporal with `poe stop-temporal`.
# Run this in ONE terminal:  uv run poe stack
stack.shell = """
if ! nc -z 127.0.0.1 7233 2>/dev/null; then
  echo '[stack] starting Temporal dev server in background (logs: /tmp/temporal-dev.log)';
  nohup temporal server start-dev --ip 127.0.0.1 --port 7233 --ui-port 8233 > /tmp/temporal-dev.log 2>&1 &
  for i in $(seq 1 30); do nc -z 127.0.0.1 7233 2>/dev/null && break; sleep 1; done;
fi;
nc -z 127.0.0.1 7233 2>/dev/null && echo '[stack] Temporal is up on :7233 (UI: http://localhost:8233)' || { echo '[stack] ERROR: Temporal did not come up — see /tmp/temporal-dev.log'; exit 1; };
dapr run --app-id github-connector --dapr-http-port 3500 --resources-path ./components -- uv run python -m app.run_dev 2>&1 | grep --line-buffered -vE 'placement|scheduler|watchhosts|api/v2/spans'
"""

# Stop the background Temporal dev server started by `stack`.
stop-temporal.shell = "pkill -f 'temporal server start-dev' && echo 'Temporal stopped' || echo 'No Temporal dev server running'"

# --- Individual pieces (if you prefer two terminals) ------------------------
start-temporal.shell = "temporal server start-dev --ip 127.0.0.1 --port 7233 --ui-port 8233"
dev-dapr.shell = "dapr run --app-id github-connector --dapr-http-port 3500 --resources-path ./components -- uv run python -m app.run_dev 2>&1 | grep --line-buffered -vE 'placement|scheduler|watchhosts|api/v2/spans'"

# Config-screen form preview only (no Temporal/Dapr, mocked backend).
preview.shell = "python serve_playground.py"

# Run tests.
test       = "pytest -q"
test-unit  = "pytest -q tests/unit"
test-int   = "pytest -q -m integration tests/integration"
